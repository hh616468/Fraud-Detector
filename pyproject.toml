[project]
name = "fraud-detector"
version = "0.1.0"
description = "Pre-commit scam warning agent for a mock Iraqi mobile wallet: readable rules + Iraqi-Arabic LLM coaching"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "sqlalchemy>=2.0.36",
    "pyyaml>=6.0.2",
    "httpx>=0.27",
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["rules*", "wallet*", "coach*", "data*", "eval*"]

[tool.setuptools.package-data]
rules = ["*.yaml", "*.json"]
coach = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["rules", "wallet", "coach", "data", "eval", "config", "conftest"]
